name: PocketJLauncher
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: Q42CQ5VP5A
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    SUPPORTED_PLATFORMS: iphoneos
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    ARCHS: arm64
targets:
  PocketJ Launcher:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: XcodeRunner
        excludes:
          - build_pocketj.sh
          - Info.plist
          - PocketJLauncher.entitlements
      - path: JITIntegration/Host/PocketJJITExtensionPoint.swift
    dependencies:
      - target: PocketJJITCoordinator
        embed: false
      - target: PocketJJITHelper
        embed: false
    settings:
      base:
        PRODUCT_NAME: PocketJLauncher
        PRODUCT_BUNDLE_IDENTIFIER: com.Erico.PocketJLauncher
        INFOPLIST_FILE: XcodeRunner/Info.plist
        CODE_SIGN_ENTITLEMENTS: XcodeRunner/PocketJLauncher.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
    postBuildScripts:
      - name: Build and embed PocketJ Launcher
        path: XcodeRunner/build_pocketj.sh
        basedOnDependencyAnalysis: false

  PocketJJITCoordinator:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: JITIntegration/Shared
      - path: JITIntegration/Host/PocketJJITExtensionPoint.swift
      - path: JITIntegration/Host/PocketJJITCoordinator.swift
    dependencies:
      - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Erico.PocketJLauncher.JITCoordinator
        PRODUCT_NAME: PocketJJITCoordinator
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO

  StikJIT:
    type: framework
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Vendor/StikJIT/Sources
      - path: Vendor/StikJIT/Resources
        buildPhase: resources
    dependencies:
      - sdk: JavaScriptCore.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: SystemConfiguration.framework
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Erico.PocketJLauncher.StikJIT
        PRODUCT_NAME: StikJIT
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Vendor/StikJIT/idevice $(SRCROOT)/Vendor/StikJIT/iokit"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/StikJIT/idevice $(SRCROOT)/Vendor/StikJIT/iokit"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor/StikJIT/idevice"
        OTHER_LDFLAGS: "-force_load $(SRCROOT)/Vendor/StikJIT/idevice/libidevice_ffi.a"

  PocketJJITHelper:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: JITIntegration/Shared
      - path: JITIntegration/Helper
    dependencies:
      - target: StikJIT
        embed: true
      - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Erico.PocketJLauncher.JITHelper
        PRODUCT_NAME: PocketJJITHelper
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1.1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: JITIntegration/Helper/Info.plist
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
        SKIP_INSTALL: NO
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  PocketJ Launcher:
    build:
      targets:
        PocketJ Launcher: all
    run:
      config: Debug
    archive:
      config: Release
