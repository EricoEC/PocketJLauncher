name: Sync to Gitee

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync
        run: |
          git remote add gitee https://EricoCZ:${{ secrets.GITEE_TOKEN }}@gitee.com/EricoCZ/PocketJLauncher.git
          git push gitee main --force --tags
